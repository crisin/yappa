[package]
name = "spike-s1"
description = "S1 PoC (scratch): engine CLI — cpal <-> LiveKit, click latency, loss, reconnect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yappa-poc"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
futures-util = "0.3"
livekit = { version = "0.9", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.8", default-features = false, features = ["access-token"] }
rtrb = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true
