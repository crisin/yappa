# The gate on every push and PR: `cargo xtask check --ci` on the two target platforms.
# Dormant until the repo has a GitHub remote. Pinning actions to SHAs is a follow-up.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustup is preinstalled; rust-toolchain.toml selects the pinned version + components.
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-insta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: cargo xtask check --ci
        run: cargo xtask check --ci
        env:
          # insta: fail on snapshot mismatch instead of writing .snap.new files
          CI: true
