[workspace]
resolver = "2"
members = ["crates/*", "xtask", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
engine-protocol = { path = "crates/engine-protocol" }
api-types = { path = "crates/api-types" }
dsp = { path = "crates/dsp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
