# cargo deny check — licenses, advisories, banned/duplicate crates, sources.
# Part of `cargo xtask check`. The license list is the guard for the open license question
# (ADR-000): copyleft (GPL/AGPL, e.g. VST3 SDK bindings) must not slip in unnoticed.

[graph]
all-features = false
# Only the platforms we ship. Tauri's Linux stack (gtk-rs, webkit2gtk) is out of scope and
# carries unmaintained crates (e.g. RUSTSEC-2024-0370 proc-macro-error via gtk3-macros).
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
